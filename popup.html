<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            width: 260px;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #202124;
            margin: 0;
        }

        .header {
            border-bottom: 1px solid #dadce0;
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .header h3 {
            margin: 0;
            color: #1a73e8;
            font-size: 16px;
            font-weight: 600;
        }

        .status-box {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3);
        }

        .status-row {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .status-indicator {
            font-weight: 600;
            color: #188038;
            /* Google Green */
        }

        .status-indicator.error {
            color: #d93025;
            /* Google Red */
        }

        .time {
            font-size: 12px;
            color: #5f6368;
        }

        .footer {
            font-size: 11px;
            color: #5f6368;
            text-align: center;
            border-top: 1px solid #dadce0;
            padding-top: 12px;
            line-height: 1.5;
        }

        .footer strong {
            color: #202124;
        }

        .footer a {
            color: #1a73e8;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="header">
        <h3>Session Keeper Pro</h3>
    </div>

    <div class="status-box">
        <div class="status-row">Status: <span id="status" class="status-indicator">Checking...</span></div>
        <div class="time">Last Ping: <span id="lastPing">-</span></div>
    </div>

    <div class="footer">
        Developed by <strong>Monowar Husain</strong><br>
        Feedback: <a href="mailto:monowar.husain@g.bracu.ac.bd">monowar.husain@g.bracu.ac.bd</a>
    </div>

    <script src="popup.js"></script>
</body>

</html>
